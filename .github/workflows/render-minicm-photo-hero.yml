name: Render MiniCM photo hero
on:
  push:
    paths:
      - ".github/workflows/render-minicm-photo-hero.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.1.0 requests==2.32.3
      - name: Render three-device MiniCM hero
        run: python scripts/render_minicm_hero.py
      - name: Commit rendered artwork to main
        run: |
          git config user.name "nobodyAtall-code"
          git config user.email "hashyofficial@gmail.com"
          git add profile/assets/minicm-photo-hero.png
          if ! git diff --cached --quiet; then
            git commit -m "Render unified MiniCM hero with real Xperia device photos"
            git push origin HEAD:main
          fi
